<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
</head>

<body>

    <header>
        <div class="container">
            <ul>
                <a href="pripyat.html">Национальный парк «Припятский»</a>
                <a href="narochan.html">Национальный парк «Нарочанский»</a>
                <a href="belopusha.html">Национальный парк «Беловежская пуща»</a>
                <a href="braslav.html">Национальный парк «Браславские озера»</a>
                <a href="zapov.html">Березинский биосферный заповедник</a>
            </ul>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="slider-wrapper">
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <a href="narochan.html" class="slide-link">
                                <img src="image/IMG-4ac4da59d6d65d2def0ddf056c987865-V.jpg" alt="map"
                                    class="slide-image">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="narochan.html" class="slide-link"><img src="image/naroch.png" alt="map"
                                    class="slide-image"></a>
                        </div>
                        <div class="swiper-slide">
                            <a href="belopusha.html" class="slide-link"><img src="image/puscha.jpg" alt="map"
                                    class="slide-image"></a>
                        </div>
                        <div class="swiper-slide">
                            <a href="braslav.html" class="slide-link"><img src="image/braslav.jpg" alt="map"
                                    class="slide-image"></a>
                        </div>
                        <div class="swiper-slide">
                            <a href="zapov.html" class="slide-link"><img src="image/ber.png" alt="map"
                                    class="slide-image"></a>
                        </div>
                    </div>

                    <div class="swiper-pagination"></div>

                    <div class="swiper-button-next">
                        <img src="image/Switchcontainer2.svg" alt="next">
                    </div>
                    <div class="swiper-button-prev">
                        <img src="image/Switchcontainer.svg" alt="prev">
                    </div>
                </div>
            </div>
        </div>

    </section>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper(".mySwiper", {
            loop: true,
            loopedSlides: 5,
            slidesPerView: 1,
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
        });
    </script>

</body>

</html>
